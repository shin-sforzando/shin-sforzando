name: Lowlighter Metrics

on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config_timezone: Asia/Tokyo
          # Replaces github-profile-3d-contrib (one workflow for all images)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Replaces the language donut of github-profile-3d-contrib
          plugin_languages: yes
          plugin_languages_limit: 8
          # Notebook JSON (outputs, images) inflates byte counts over real code
          plugin_languages_ignored: jupyter notebook
          # plugin_achievements is omitted: it queries the removed Projects
          # (classic) API and always fails (lowlighter/metrics#1706)
      # Separate image so README can place it right above the coffee button
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          filename: github-sponsors.svg
          base: ""
          plugin_sponsors: yes
          # "list" is left out while there are no sponsors to show
          plugin_sponsors_sections: goal, about
